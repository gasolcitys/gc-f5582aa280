name: Telegram · gasolineras más baratas por comunidad

# 7:30 y 19:30 hora de Madrid. GitHub usa UTC, así que se programa para invierno (UTC+1) y verano (UTC+2)
# y el script solo publica en la ejecución que cae a las 7 o a las 19 en Madrid.
# 7:30: los precios cambian sobre todo entre las 0:00 y las 3:00 y de 4:00 a 6:00 apenas se mueven.
# 19:30: recoge los ajustes que se hacen durante el día (10:00-19:00).
on:
  schedule:
    - cron: '25 5,6,17,18 * * *'
  workflow_dispatch:
    inputs:
      destino:
        description: 'Probar: chat al que enviar todo (p. ej. @mi_canal_de_pruebas). Vacío = canal de cada comunidad'
        required: false
      ccaa:
        description: 'Solo estas comunidades (IDCCAA separados por comas, p. ej. 13,08). Vacío = todas'
        required: false
      borrar:
        description: 'Borrar antes los mensajes de los canales (solo los de menos de 48 horas)'
        type: boolean
        default: false

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Borrar los mensajes de los canales
        if: ${{ inputs.borrar }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.AVISO_PRECIOS_BOT }}
          CCAA: ${{ inputs.ccaa }}
        run: |
          set --
          [ -n "$CCAA" ] && set -- "$@" --ccaa "$CCAA"
          node scripts/telegram-borrar.mjs "$@"
      - name: Publicar en los canales
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.AVISO_PRECIOS_BOT }}
          DESTINO: ${{ inputs.destino }}
          CCAA: ${{ inputs.ccaa }}
        run: |
          set --
          [ "${{ github.event_name }}" = "schedule" ] && set -- "$@" --horas 7,19
          [ -n "$DESTINO" ] && set -- "$@" --a "$DESTINO"
          [ -n "$CCAA" ] && set -- "$@" --ccaa "$CCAA"
          node scripts/telegram-ccaa.mjs "$@"
